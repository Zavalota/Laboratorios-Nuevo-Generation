<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>replit</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body>
 <div class="container-fluid">
   <h1>Hello world</h1>
   <button type="button" class="btn btn-primary">Botón Azul</button>
    <button type="button" class="btn btn-success">Botón Verde</button>
    <button type="button" class="btn btn-danger">Botón Rojo</button>

    <div class="mb-4">
      <p class="text-start">Izquierda</p>
      <p class="text-center text-danger">Centro</p>
      <p class="text-end">Derecha</p>
    </div>

    <div class="card" style="width: 18rem;">
      <img src="https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=300&q=80" class="card-img-top" alt="Cesta de fruta">
      
      <div class="card-header fw-bold">
        Hoja de ruta
      </div>
      
      <ul class="list-group list-group-flush">
        <li class="list-group-item">Manzana</li>
        <li class="list-group-item">Plátano</li>
        <li class="list-group-item">Naranja</li>
      </ul>
    </div>
  </div>
  
  <script src="script.js"></script>

  <!--
  This script places a badge on your repl's full-browser view back to your repl's cover
  page. Try various colors for the theme: dark, light, red, orange, yellow, lime, green,
  teal, blue, blurple, magenta, pink!
  -->
  <script src="https://replit.com/public/js/replit-badge-v2.js" theme="dark" position="bottom-right"></script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmxc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>

</html>
